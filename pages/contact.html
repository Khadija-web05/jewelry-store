<div class="header">
  <h1>Product Feedback</h1>
  <p>Write your feedback about rings, necklaces or bracelets.</p>
</div>

<div class="form-container">
  <h2>Feedback Form</h2>

  <form>
    <div>
      <label>Name</label>
      <input type="text" id="feedbackName">
    </div>

    <div>
      <label>Product Type</label>
      <select id="feedbackProduct">
        <option>Rings</option>
        <option>Necklaces</option>
        <option>Bracelets</option>
      </select>
    </div>

    <div>
      <label>Feedback</label>
      <textarea id="feedbackMessage" rows="5"></textarea>
    </div>

    <button type="button" class="primary-button medium-button" onclick="saveFeedback()">Save Feedback</button>
  </form>

  <p id="feedbackResult"></p>
</div>
