  <form>
    <div>
      <label>Name</label>
      <input type="text">
    </div>

    <div>
      <label>Email</label>
      <input type="email">
    </div>

        <option>Rings</option>
        <option>Necklaces</option>
        <option>Bracelets</option>
      </select>
    </div>

    <div>
      <label>Message</label>
      <textarea rows="5"></textarea>
    </div>

    <!-- CHANGED: form button type and size added -->
<button class="outline-button medium-button">Submit</button>
